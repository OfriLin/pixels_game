<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>פיקסל אחר פיקסל</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2315171B'/%3E%3Crect x='1' y='1' width='6.5' height='6.5' fill='%23FF0000'/%3E%3Crect x='8.5' y='1' width='6.5' height='6.5' fill='%2300FF00'/%3E%3Crect x='1' y='8.5' width='6.5' height='6.5' fill='%230000FF'/%3E%3Crect x='8.5' y='8.5' width='6.5' height='6.5' fill='%23FFFFFF'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Hebrew:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<style>
/* ===================== צבעים וגופנים ===================== */
:root {
  --paper: #FFFFFF;
  --canvas: #B7BBC1;          /* רקע אפור ניטרלי, כמו בתוכנות עריכת תמונה */
  --canvas-ink: #15171B;
  --ink: #15171B;
  --muted: #5F656F;
  --line: #15171B;
  --line-soft: #D6D9DE;
  --code-bg: #F3F4F6;
  --sel: #CCD5FF;
  --accent: #1238FF;
  --accent-ink: #FFFFFF;
  --grid-line: #15171B;
  --verdict-ink: #FFFFFF;
  --ok: #0B7A3B;   --ok-bg: #E4F4EA;
  --bad: #C0102C;  --bad-bg: #FCE8EB;
  --warn: #9A4D00; --warn-bg: #FCF0DE;
  --check-a: #FFFFFF; --check-b: #D9DCE0;
  --syn-kw: #1238FF; --syn-num: #B3261E; --syn-str: #0B7A3B;
  --syn-com: #767C86; --syn-def: #7A2BC9; --syn-builtin: #8A5300;

  --sans: "IBM Plex Sans Hebrew", "Segoe UI", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, "Courier New", monospace;
  --header-h: 68px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #1A1C20;
    --canvas: #3A3D43;
    --canvas-ink: #EEEFF1;
    --ink: #EEEFF1;
    --muted: #9CA1AA;
    --line: #EEEFF1;
    --line-soft: #34373D;
    --code-bg: #121417;
    --sel: #2B3A80;
    --accent: #7A90FF;
    --accent-ink: #0B0C0E;
    --grid-line: #0B0C0E;
    --verdict-ink: #0B0C0E;
    --ok: #52C986;   --ok-bg: #15291D;
    --bad: #FF7085;  --bad-bg: #36161B;
    --warn: #F2A85A; --warn-bg: #352613;
    --check-a: #2B2E33; --check-b: #35383E;
    --syn-kw: #8FA2FF; --syn-num: #FF9A8A; --syn-str: #7FD6A0;
    --syn-com: #7C828C; --syn-def: #D1A6FF; --syn-builtin: #F0C27A;
    color-scheme: dark;
  }
}

/* ===================== בסיס ===================== */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--sans);
  font-size: 17px;
  line-height: 1.6;
  color: var(--ink);
  background: var(--paper);
  -webkit-font-smoothing: antialiased;
}
code { font-family: var(--mono); font-size: .88em; }
.goal code, .reqs code, .hint code, .status code:not(.err-code), .insp-note code, .stage-meta code, .out-empty code {
  direction: ltr;
  unicode-bidi: isolate;
  background: var(--code-bg);
  border: 1px solid var(--line-soft);
  padding: 0 .32em;
  white-space: nowrap;
}
button { font-family: inherit; }
[hidden] { display: none !important; }

/* ===================== סרגל עליון ===================== */
.topbar {
  height: var(--header-h);
  display: flex;
  align-items: center;
  gap: 32px;
  padding: 0 28px;
  background: var(--paper);
  border-bottom: 2px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 12px; }
.logo {
  display: grid;
  grid-template-columns: repeat(2, 13px);
  grid-template-rows: repeat(2, 13px);
  gap: 2px;
  background: #15171B;
  border: 2px solid #15171B;
  flex: none;
}
.logo i:nth-child(1) { background: #FF0000; }
.logo i:nth-child(2) { background: #00FF00; }
.logo i:nth-child(3) { background: #0000FF; }
.logo i:nth-child(4) { background: #FFFFFF; }
.brand-title { font-weight: 700; font-size: 19px; line-height: 1.2; }
.brand-sub { font-size: 13.5px; color: var(--muted); line-height: 1.3; }

.qnav { display: flex; gap: 6px; }
.qtab {
  position: relative;
  width: 40px; height: 40px;
  border: 2px solid var(--line);
  border-radius: 0;
  background: var(--paper);
  color: var(--ink);
  font: 700 16px/1 var(--sans);
  cursor: pointer;
}
.qtab:hover { background: var(--code-bg); }
.qtab[aria-current="step"] { background: var(--ink); color: var(--paper); }
.qtab.is-solved::after {
  content: "";
  position: absolute;
  top: -6px; inset-inline-end: -6px;
  width: 12px; height: 12px;
  background: var(--ok);
  border: 2px solid var(--paper);
}
.qtab:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.engine {
  margin-inline-start: auto;
  display: flex; align-items: center; gap: 8px;
  font-size: 14px; color: var(--muted);
  white-space: nowrap;
}
.engine-dot { width: 10px; height: 10px; background: var(--muted); flex: none; }
.engine[data-state="loading"] .engine-dot { background: var(--warn); animation: blink 1s steps(2, jump-none) infinite; }
.engine[data-state="ready"] .engine-dot { background: var(--ok); }
.engine[data-state="error"] .engine-dot { background: var(--bad); }
.engine[data-state="error"] { color: var(--bad); }
@keyframes blink { 50% { opacity: .2; } }

/* ===================== פריסה ===================== */
.workspace { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.stage {
  background: var(--canvas);
  color: var(--canvas-ink);
  border-inline-end: 2px solid var(--line);
}
.stage-inner {
  max-width: 980px;
  margin: 0 auto;
  padding: 32px 32px 56px;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 36px 28px;
  align-items: start;
}
/* כשיש מקום, התמונה הנתונה והתמונה שלכם עומדות זו לצד זו */
.stage-inner.is-split { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.stage-inner.is-split #given-block { grid-column: 1; grid-row: 1; }
.stage-inner.is-split #given-code  { grid-column: 1; grid-row: 2; }
.stage-inner.is-split #result-block { grid-column: 2; grid-row: 1 / span 2; }
.stage-block { width: 100%; max-width: var(--col, 400px); margin-inline: auto; }
.stage-inner.is-split #given-code { margin-top: -12px; }
.stage-head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  margin: 0 auto 12px;
}
.stage-head h2 { margin: 0; font-size: 20px; font-weight: 700; line-height: 1.3; }
.stage-meta { font-size: 15px; }
.stage-meta code { background: var(--paper); border-color: var(--line); color: var(--ink); }

@media (min-width: 981px) {
  body { height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
  .workspace { flex: 1; min-height: 0; }
  .stage, .task { overflow-y: auto; min-height: 0; }
}

/* ===================== תצוגת פיקסלים ===================== */
.pixel-view { width: 100%; margin: 0 auto; display: flex; flex-direction: column; }
.px-grid {
  display: grid;
  gap: 2px;
  width: 100%;
  background: var(--grid-line);
  border: 2px solid var(--grid-line);
}
.px {
  position: relative;
  display: flex; align-items: center; justify-content: center;
  min-width: 0;
  overflow: hidden;
  font-family: var(--mono);
  font-weight: 500;
  font-size: var(--fs, 13px);
  outline: none;
}
.px-idx {
  position: absolute; top: 5px; left: 6px;
  font-size: var(--idx-fs, 12px);
  font-weight: 600;
  line-height: 1;
  opacity: .72;
}
.px-tup { white-space: nowrap; line-height: 1; }
.hide-tuples .px-tup, .hide-idx .px-idx { display: none; }
.px.is-active { box-shadow: inset 0 0 0 3px currentColor; }
.px:focus-visible { box-shadow: inset 0 0 0 3px currentColor, inset 0 0 0 6px var(--accent); }
.px-missing {
  background: repeating-linear-gradient(45deg, #E6E8EB 0 6px, #C9CCD2 6px 12px);
  color: #15171B;
}
.px-diff::after {
  content: "✕";
  position: absolute; top: 4px; right: 4px;
  width: 20px; height: 20px;
  display: grid; place-items: center;
  background: #FFFFFF;
  color: #C0102C;
  border: 2px solid #15171B;
  font: 700 11px/1 var(--sans);
}
.px-reveal { animation: px-in .2s ease-out both; }
@keyframes px-in { from { opacity: 0; transform: scale(.55); } to { opacity: 1; transform: none; } }

.px-empty {
  width: 100%;
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
  border: 2px dashed var(--canvas-ink);
  background-color: var(--check-a);
  background-image: conic-gradient(var(--check-b) 25%, var(--check-a) 0 50%, var(--check-b) 0 75%, var(--check-a) 0);
  background-size: 24px 24px;
}
.px-empty p {
  margin: 0;
  max-width: 85%;
  padding: 8px 14px;
  text-align: center;
  font-size: 15px;
  background: var(--paper);
  color: var(--ink);
  border: 2px solid var(--line);
}

.inspector {
  background: var(--paper);
  color: var(--ink);
  border: 2px solid var(--grid-line);
  border-top: 0;
  padding: 12px 14px;
  min-height: 132px;
}
.insp-idle { margin: 0; color: var(--muted); font-size: 15px; }
.insp-top { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 4px 12px; }
.insp-code { font-size: 16px; font-weight: 600; }
.insp-pos { font-size: 14px; color: var(--muted); }
.insp-bars { margin-top: 10px; display: grid; gap: 6px; }
.bar { display: grid; grid-template-columns: 14px 1fr 30px; align-items: center; gap: 10px; font: 500 13px/1 var(--mono); }
.bar-track { position: relative; height: 10px; background: var(--code-bg); border: 1px solid var(--line-soft); }
.bar-fill { position: absolute; top: 0; bottom: 0; left: 0; }
.bar-val { text-align: right; }
.insp-note { margin: 8px 0 0; font-size: 14.5px; line-height: 1.5; color: var(--bad); }

.list-title { margin: 0 0 8px; font-size: 15px; font-weight: 700; }
.list-code {
  margin: 0;
  padding: 12px 14px;
  overflow-x: auto;
  white-space: pre;
  text-align: left;
  font: 500 13.5px/1.75 var(--mono);
  background: var(--paper);
  color: var(--ink);
  border: 2px solid var(--line);
}
.tok-name { font-weight: 600; }
.tok-tuple { padding: 1px 0; }
.tok-tuple.is-active { background: var(--accent); color: var(--accent-ink); }
.list-details { margin-top: 16px; }
.list-details summary, .hint summary {
  cursor: pointer;
  list-style: none;
  font-weight: 700;
  font-size: 15px;
  display: inline-flex; align-items: center; gap: 8px;
}
.list-details summary::-webkit-details-marker, .hint summary::-webkit-details-marker { display: none; }
.list-details summary::before, .hint summary::before {
  content: "+";
  display: inline-grid; place-items: center;
  width: 20px; height: 20px;
  border: 2px solid currentColor;
  font: 700 14px/1 var(--mono);
}
.list-details[open] summary::before, .hint[open] summary::before { content: "−"; }
.list-details summary:focus-visible, .hint summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.list-details .list-code { margin-top: 8px; }

/* ===================== חלונית המשימה ===================== */
.task { background: var(--paper); }
.task-inner { max-width: 700px; margin: 0 auto; padding: 32px 40px 40px; }
.q-count { margin: 0 0 4px; font-size: 15px; font-weight: 500; color: var(--muted); }
.task h1 { margin: 0 0 14px; font-size: clamp(28px, 2.5vw, 36px); line-height: 1.15; font-weight: 700; letter-spacing: -.01em; }
.goal p { margin: 0 0 10px; max-width: 62ch; }
.reqs { list-style: none; padding: 0; margin: 12px 0 14px; display: flex; flex-wrap: wrap; gap: 8px; }
.reqs li { border: 2px solid var(--line); padding: 3px 10px; font-size: 14.5px; font-weight: 500; }
.hint { margin: 0 0 18px; }
.hint-body { margin-top: 8px; padding: 10px 14px; background: var(--code-bg); border-inline-start: 4px solid var(--accent); font-size: 16px; }

.editor-frame { border: 2px solid var(--line); }
.editor-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 7px 12px;
  background: var(--ink); color: var(--paper);
  font-size: 14px; font-weight: 500;
}
.editor-bar kbd { font: 500 12px/1 var(--mono); border: 1px solid currentColor; padding: 2px 5px; }
#editor .CodeMirror {
  height: auto;
  font-family: var(--mono);
  font-size: 15.5px;
  line-height: 1.65;
  background: var(--code-bg);
  color: var(--ink);
}
#editor .CodeMirror-scroll { min-height: 240px; max-height: 460px; }
#editor .CodeMirror-lines { padding: 10px 0; }
#editor .CodeMirror-gutters { background: var(--code-bg); border-right: 2px solid var(--line-soft); }
#editor .CodeMirror-linenumber { color: var(--muted); padding: 0 8px 0 6px; }
#editor .CodeMirror-cursor { border-left: 2px solid var(--ink); }
#editor .CodeMirror-selected, #editor .CodeMirror-focused .CodeMirror-selected { background: var(--sel); }
#editor .CodeMirror-matchingbracket { color: inherit !important; background: var(--sel); }
#editor .cm-error-line { background: var(--bad-bg); }
#editor .cm-s-default .cm-keyword { color: var(--syn-kw); font-weight: 600; }
#editor .cm-s-default .cm-number { color: var(--syn-num); }
#editor .cm-s-default .cm-string { color: var(--syn-str); }
#editor .cm-s-default .cm-comment { color: var(--syn-com); font-style: normal; }
#editor .cm-s-default .cm-def { color: var(--syn-def); }
#editor .cm-s-default .cm-builtin { color: var(--syn-builtin); }
#editor .cm-s-default .cm-variable,
#editor .cm-s-default .cm-variable-2,
#editor .cm-s-default .cm-property,
#editor .cm-s-default .cm-operator,
#editor .cm-s-default .cm-meta { color: var(--ink); }
.editor-fallback {
  display: block; width: 100%; min-height: 240px;
  padding: 12px 14px;
  border: 0; resize: vertical;
  font: 15.5px/1.65 var(--mono);
  background: var(--code-bg); color: var(--ink);
  direction: ltr; text-align: left; tab-size: 4;
}
.editor-fallback:focus { outline: 3px solid var(--accent); outline-offset: -3px; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 48px;
  padding: 10px 20px;
  border: 2px solid var(--line);
  border-radius: 0;
  background: var(--paper);
  color: var(--ink);
  font: 700 16px/1 var(--sans);
  cursor: pointer;
}
.btn:hover { background: var(--code-bg); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn[disabled] { opacity: .4; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--ink); color: var(--paper); }
.btn-primary:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-run { min-width: 150px; }
.btn-run.is-running { background: var(--paper); color: var(--ink); border-color: var(--line); }
.btn-run.is-running:hover { background: var(--code-bg); color: var(--ink); }
.btn.is-armed { border-color: var(--bad); color: var(--bad); }
.ico { width: 14px; height: 14px; fill: currentColor; flex: none; }

.status { margin-top: 16px; }
.status:empty { display: none; }
.status-box { display: grid; grid-template-columns: auto minmax(0, 1fr); border: 2px solid var(--kc); background: var(--kbg); }
.status-box[data-kind="ok"]   { --kc: var(--ok);   --kbg: var(--ok-bg); }
.status-box[data-kind="bad"]  { --kc: var(--bad);  --kbg: var(--bad-bg); }
.status-box[data-kind="warn"] { --kc: var(--warn); --kbg: var(--warn-bg); }
.status-box[data-kind="info"],
.status-box[data-kind="busy"] { --kc: var(--ink);  --kbg: var(--code-bg); }
.verdict { padding: 10px 14px; background: var(--kc); color: var(--verdict-ink); font-weight: 700; font-size: 16px; line-height: 1.5; }
.status-box[data-kind="info"] .verdict, .status-box[data-kind="busy"] .verdict { color: var(--paper); }
.status-body { padding: 10px 14px; font-size: 16px; line-height: 1.55; }
.status-body > p { margin: 0 0 6px; }
.status-body > :last-child { margin-bottom: 0; }
.status-body ul { margin: 0 0 6px; padding-inline-start: 20px; }
.err-code {
  display: block;
  margin: 6px 0 8px;
  padding: 6px 10px;
  direction: ltr; text-align: left;
  white-space: pre-wrap; word-break: break-word;
  font-size: 14px;
  background: var(--paper);
  border: 1px solid var(--line-soft);
}
.status-body .btn { margin-top: 8px; min-height: 42px; padding: 8px 16px; font-size: 15px; }

.output { margin-top: 24px; }
.output h3 { margin: 0 0 6px; font-size: 15px; font-weight: 700; }
.out-empty { margin: 0; color: var(--muted); font-size: 15px; }
#stdout {
  margin: 0;
  padding: 10px 12px;
  max-height: 220px; overflow: auto;
  white-space: pre-wrap; word-break: break-word;
  text-align: left;
  font: 14px/1.6 var(--mono);
  background: var(--code-bg);
  border: 2px solid var(--line-soft);
}
.shown { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 12px; }
.shown figure { margin: 0; width: min(100%, 260px); }
.shown figcaption { margin-top: 6px; font-size: 14px; color: var(--muted); }
.shown canvas { display: block; width: 100%; image-rendering: pixelated; border: 2px solid var(--grid-line); }

.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 32px; padding-top: 20px; border-top: 2px solid var(--line-soft); }

/* ===================== מסכים קטנים ===================== */
@media (max-width: 980px) {
  .workspace { grid-template-columns: minmax(0, 1fr); }
  .stage { border-inline-end: 0; border-bottom: 2px solid var(--line); }
  .topbar { height: auto; flex-wrap: wrap; gap: 12px 24px; padding: 12px 18px; }
  .stage-inner { padding: 24px 18px 36px; }
  .task-inner { padding: 24px 18px 36px; }
}
@media (max-width: 560px) {
  .brand-sub, .kbd-hint { display: none; }
  .engine { margin-inline-start: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .px-reveal, .engine-dot { animation: none !important; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <div>
      <div class="brand-title">פיקסל אחר פיקסל</div>
      <div class="brand-sub">תמונות כרשימה של טאפלים בפייתון</div>
    </div>
  </div>
  <nav class="qnav" id="qnav" aria-label="שאלות"></nav>
  <div class="engine" id="engine" data-state="loading" role="status">
    <span class="engine-dot" aria-hidden="true"></span>
    <span id="engine-text">טוען את פייתון…</span>
  </div>
</header>

<main class="workspace">
  <!-- צד ימין: התמונות -->
  <section class="stage" aria-label="תמונות">
    <div class="stage-inner" id="stage-inner">
      <div class="stage-block" id="given-block">
        <div class="stage-head" id="given-head">
          <h2>התמונה הנתונה</h2>
          <span class="stage-meta" id="given-meta"></span>
        </div>
        <div id="given-view"></div>
      </div>
      <div class="stage-block" id="given-code"></div>
      <div class="stage-block" id="result-block">
        <div class="stage-head" id="result-head">
          <h2>התמונה שלכם</h2>
          <span class="stage-meta" id="result-meta"></span>
        </div>
        <div id="result-view"></div>
      </div>
    </div>
  </section>

  <!-- צד שמאל: המטרה ועורך הקוד -->
  <section class="task" aria-label="המשימה">
    <div class="task-inner">
      <p class="q-count" id="q-count"></p>
      <h1 id="q-title"></h1>
      <div class="goal" id="q-goal"></div>
      <ul class="reqs" id="q-reqs"></ul>
      <details class="hint" id="q-hint">
        <summary>רמז</summary>
        <div class="hint-body" id="q-hint-body"></div>
      </details>

      <div class="editor-frame">

<script type="text/plain" id="py-runner">
import ast
import contextlib
import io
import json
import re
import sys
import traceback
import types

_STUDENT_FILE = "student.py"
_MAX_OUTPUT = 20000
_shown_images = []


class _CappedOutput(io.StringIO):
    def write(self, s):
        if self.tell() < _MAX_OUTPUT:
            return super().write(s)
        return len(s)


def _clamp(v):
    return max(0, min(255, int(v)))


def show_image(pixel_list, image_size=None, display_size=None):
    """תואמת לפונקציית העזר מהמחברת: מציגה רשימת פיקסלים כתמונה בחלון הפלט."""
    data = list(pixel_list)
    if image_size is None:
        side = int(round(len(data) ** 0.5))
        if side * side != len(data):
            raise ValueError("show_image: cannot guess the image size, pass it too, e.g. show_image(pixels, (4, 4))")
        image_size = (side, side)
    w, h = int(image_size[0]), int(image_size[1])
    out = []
    for p in data[: w * h]:
        try:
            r, g, b = p
            out.append([_clamp(r), _clamp(g), _clamp(b)])
        except Exception:
            out.append(None)
    out.extend([None] * (w * h - len(out)))
    _shown_images.append({"w": w, "h": h, "pixels": out, "label": "show_image"})


def display(*objs, **kwargs):
    for obj in objs:
        if all(hasattr(obj, a) for a in ("getdata", "size", "convert")):
            img = obj.convert("RGB")
            if img.size[0] * img.size[1] > 250000:
                img = img.copy()
                img.thumbnail((500, 500))
            w, h = img.size
            _shown_images.append({"w": w, "h": h, "pixels": [list(p) for p in img.getdata()], "label": "display"})
        else:
            print(repr(obj))


# מודול מדומה, כדי ש- from IPython.display import display יעבוד כמו במחברת
_ipython = types.ModuleType("IPython")
_ipython_display = types.ModuleType("IPython.display")
_ipython_display.display = display
_ipython.display = _ipython_display
sys.modules["IPython"] = _ipython
sys.modules["IPython.display"] = _ipython_display


def _no_input(*args, **kwargs):
    raise RuntimeError("input() is not available here. Write the values directly in the code.")


def _namespace(p):
    return {
        "__name__": "__main__",
        "pixels": [tuple(px) for px in p["pixels"]],
        "WIDTH": p["width"],
        "HEIGHT": p["height"],
        "show_image": show_image,
        "display": display,
        "input": _no_input,
    }


def _hint(name, message):
    m = (message or "").lower()
    if name in ("IndentationError", "TabError"):
        return "בעיית הזחה. שורות שנמצאות בתוך לולאה צריכות להיות מוזחות פנימה (4 רווחים), וכל השורות באותו בלוק צריכות אותה הזחה."
    if name == "SyntaxError":
        if "expected ':'" in m:
            return "חסרות נקודתיים `:` בסוף השורה, למשל בסוף שורת ה-`for`."
        if "never closed" in m or "unmatched" in m or "does not match" in m:
            return "יש סוגר שלא נסגר, או סוגר מיותר. בדקו שלכל `(` יש `)` מתאים."
        if "forgot a comma" in m:
            return "נראה שחסר פסיק, למשל בין הערכים בתוך הטאפל."
        if "unterminated string" in m:
            return "יש מחרוזת שלא נסגרה במירכאות."
        if "leading zeros" in m:
            return "אי אפשר לכתוב מספר שמתחיל ב-0, כמו `05`. כתבו `5`."
        return "שגיאת תחביר. בדקו סוגריים, פסיקים ונקודתיים בשורה המסומנת או בשורה שלפניה."
    if name == "NameError":
        found = re.search(r"name '([^']+)'", message or "")
        n = found.group(1) if found else "?"
        return f"השם `{n}` לא מוגדר. בדקו שאין שגיאת כתיב, ושהמשתנה הוגדר לפני השימוש בו."
    if name == "IndexError":
        return "ניסיתם לגשת למקום שלא קיים ברשימה. האינדקס הראשון הוא `0`, והאחרון הוא `len(pixels) - 1`."
    if name == "TypeError":
        if "does not support item assignment" in m and "tuple" in m:
            return "אי אפשר לשנות ערך בתוך טאפל קיים. צרו טאפל חדש במקומו, למשל `(r, g, 0)`."
        if "append" in m and "argument" in m:
            return "הפעולה `append` מקבלת ערך אחד בלבד. כדי להוסיף פיקסל, העבירו טאפל שלם, למשל `append((r, g, 0))`."
        if "cannot unpack" in m:
            return "ניסיתם לפרק לכמה משתנים ערך שאינו טאפל. בדקו על מה עוברת הלולאה."
        return "פעולה שלא מתאימה לסוג הנתונים. בדקו איזה סוג יש לכל משתנה בשורה המסומנת."
    if name == "ValueError" and "unpack" in m:
        return "מספר המשתנים לא מתאים למספר הערכים. בכל פיקסל יש בדיוק 3 ערכים: `r, g, b`."
    if name == "AttributeError":
        return "לסוג הנתונים הזה אין את הפעולה שניסיתם להפעיל. בדקו את האיות, למשל `append`."
    return ""


def _error_info(e):
    line = None
    for frame in traceback.extract_tb(e.__traceback__):
        if frame.filename == _STUDENT_FILE:
            line = frame.lineno
    name = type(e).__name__
    message = str(e)
    return {"type": name, "message": message, "line": line, "hint": _hint(name, message)}


def _syntax_info(e):
    name = type(e).__name__
    return {"type": name, "message": e.msg, "line": e.lineno, "hint": _hint(name, e.msg)}


_LOOP_NODES = (ast.For, ast.While, ast.ListComp, ast.SetComp, ast.DictComp, ast.GeneratorExp)


def _check_rules(tree, rules):
    nodes = list(ast.walk(tree))
    found = []
    if rules.get("noLoops") and any(isinstance(n, _LOOP_NODES) for n in nodes):
        found.append("בשאלה הזו צריך לשנות כל פיקסל ישירות לפי האינדקס שלו, בלי לולאה.")
    if rules.get("requireFor") and not any(isinstance(n, ast.For) for n in nodes):
        found.append("בשאלה הזו צריך להשתמש בלולאת `for`.")
    return found


def _pick(ns, names):
    found = [(n, ns[n]) for n in names if n in ns]
    if not found:
        return None, None
    for n, v in found:
        if isinstance(v, (list, tuple)) and len(v) > 0:
            return n, v
    return found[0]


def _inspect(value, n, var):
    if not isinstance(value, (list, tuple)):
        return None, [f"`{var}` צריך להיות רשימה של פיקסלים, אבל הוא מסוג `{type(value).__name__}`."], {}, []
    items = list(value)
    render, notes, as_list = [], {}, []
    for i, px in enumerate(items[:n]):
        note = None
        if not isinstance(px, (tuple, list)):
            note = f"האיבר הוא `{type(px).__name__}` ולא טאפל של שלושה צבעים."
        elif len(px) != 3:
            note = f"בטאפל יש {len(px)} ערכים במקום 3."
        elif not all(isinstance(c, int) and not isinstance(c, bool) for c in px):
            note = "כל ערך בטאפל צריך להיות מספר שלם."
        elif not all(0 <= c <= 255 for c in px):
            note = "כל ערך בטאפל צריך להיות בין 0 ל-255."
        if note:
            render.append(None)
            notes[str(i)] = note
        else:
            render.append([int(c) for c in px])
            if isinstance(px, list):
                as_list.append(i)
    render.extend([None] * (n - len(render)))
    problems = []
    if len(items) != n:
        problems.append(f"ברשימה `{var}` יש {len(items)} פיקסלים, אבל בתמונה צריכים להיות {n}.")
    if notes:
        problems.append(f"{len(notes)} מהפיקסלים אינם טאפל תקין מהצורה `(R, G, B)`. רחפו מעליהם כדי לראות מה הבעיה.")
    return render, problems, notes, as_list


def _run(p):
    n = p["width"] * p["height"]
    result_vars = p["resultVars"]
    out = {"status": "", "stdout": "", "images": [], "problems": [], "cellNotes": {},
           "diff": [], "var": result_vars[0], "render": None, "violations": []}

    try:
        tree = ast.parse(p["code"], _STUDENT_FILE)
    except SyntaxError as e:
        out["status"] = "syntax"
        out["error"] = _syntax_info(e)
        return out

    expected = None
    if p.get("solution"):
        try:
            sol_ns = _namespace(p)
            with contextlib.redirect_stdout(io.StringIO()):
                exec(compile(p["solution"], "solution.py", "exec"), sol_ns)
            _, sol_value = _pick(sol_ns, result_vars)
            expected = [tuple(px) for px in sol_value]
        except Exception as e:
            out["solutionError"] = f"{type(e).__name__}: {e}"
    _shown_images.clear()

    ns = _namespace(p)
    buffer = _CappedOutput()
    try:
        with contextlib.redirect_stdout(buffer):
            exec(compile(tree, _STUDENT_FILE, "exec"), ns)
    except (Exception, SystemExit) as e:
        out["stdout"] = buffer.getvalue()
        out["images"] = list(_shown_images)
        out["status"] = "error"
        out["error"] = _error_info(e)
        return out
    out["stdout"] = buffer.getvalue()
    out["images"] = list(_shown_images)

    var, value = _pick(ns, result_vars)
    if var is None:
        out["status"] = "missing"
        return out
    out["var"] = var
    render, problems, notes, as_list = _inspect(value, n, var)
    out["render"], out["problems"], out["cellNotes"] = render, problems, notes
    if render is None:
        out["status"] = "invalid"
        return out
    out["violations"] = _check_rules(tree, p.get("rules") or {})
    if expected is None:
        out["status"] = "ran"
        return out

    values = [tuple(px) if isinstance(px, (list, tuple)) else px for px in value]
    diff = [i for i in range(n) if i >= len(values) or i >= len(expected) or values[i] != expected[i]]
    out["diff"] = diff
    if diff or len(values) != len(expected):
        out["status"] = "wrong"
        original = [tuple(px) for px in p["pixels"]]
        if values == original and expected != original:
            out["unchanged"] = True
        return out
    if as_list:
        out["status"] = "almost"
        return out
    if out["violations"]:
        out["status"] = "rule"
        return out
    out["status"] = "correct"
    return out


def _run_task(payload_json):
    p = json.loads(payload_json)
    _shown_images.clear()
    try:
        result = _run(p)
    except Exception as e:
        result = {"status": "internal", "message": f"{type(e).__name__}: {e}"}
    return json.dumps(result, ensure_ascii=False)
</script>

     ה-Worker שטוען את Pyodide. הרצה בתוכו מאפשרת לעצור לולאה אינסופית.
     ============================================================ -->
<script type="text/plain" id="worker-src">
let pyodide = null;
let runTask = null;

self.onmessage = async (event) => {
  const msg = event.data;

  if (msg.type === "init") {
    try {
      importScripts(msg.url + "pyodide.js");
      pyodide = await loadPyodide({ indexURL: msg.url });
      pyodide.runPython(msg.runner);
      runTask = pyodide.globals.get("_run_task");
      self.postMessage({ type: "ready" });
    } catch (err) {
      self.postMessage({ type: "fatal", message: String((err && err.message) || err) });
    }
    return;
  }

  if (msg.type === "run") {
    const { runId, payload } = msg;
    try {
      const source = payload.code + "\n" + (payload.solution || "");
      const packages = [];
      if (/^\s*(?:from|import)\s+PIL\b/m.test(source)) packages.push("pillow");
      if (/^\s*(?:from|import)\s+numpy\b/m.test(source)) packages.push("numpy");
      if (packages.length) {
        self.postMessage({ type: "packages", runId });
        await pyodide.loadPackage(packages);
      }
      self.postMessage({ type: "exec-start", runId });
      const json = runTask(JSON.stringify(payload));
      self.postMessage({ type: "result", runId, data: JSON.parse(json) });
    } catch (err) {
      self.postMessage({ type: "result", runId, data: { status: "internal", message: String((err && err.message) || err) } });
    }
  }
};
</script>

  },
  write(data) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) { /* אין אחסון, ממשיכים בלי */ }
  },
};
const saved = store.read();
const state = {
  index: 0,
  codes: saved.codes && typeof saved.codes === "object" ? saved.codes : {},
  solved: saved.solved && typeof saved.solved === "object" ? saved.solved : {},
  running: false,
  runToken: 0,
};
const hashMatch = /^#q(\d+)$/.exec(location.hash);
if (hashMatch) state.index = Number(hashMatch[1]) - 1;
else if (Number.isInteger(saved.index)) state.index = saved.index;
state.index = Math.max(0, Math.min(QUESTIONS.length - 1, state.index));
function persist() { store.write({ codes: state.codes, solved: state.solved, index: state.index }); }

/* ================================================================
   מנוע הפייתון (Pyodide בתוך Web Worker)
   ================================================================ */
const Engine = (() => {
  const workerSrc = $("worker-src").textContent;
  const runnerSrc = $("py-runner").textContent;
  let worker = null, ready = false, failed = false;
  let pending = null, queued = null, timer = null, seq = 0;
  let onState = () => {};

  function start() {
    ready = false; failed = false;
    onState("loading");
    try {
      const url = URL.createObjectURL(new Blob([workerSrc], { type: "text/javascript" }));
      worker = new Worker(url);
    } catch (err) { fail(String(err)); return; }
    worker.onmessage = (e) => handle(e.data);
    worker.onerror = (e) => { if (e.preventDefault) e.preventDefault(); fail(e.message || "worker error"); };
    worker.postMessage({ type: "init", url: PYODIDE_URL, runner: runnerSrc });
  }
  function fail(message) {
    ready = false; failed = true;
    onState("error", message);
    clearTimeout(timer);
    const p = pending; pending = null; queued = null;
    if (p) p.resolve({ status: "engine", message });
  }
  function handle(msg) {
    if (msg.type === "ready") {
      ready = true; onState("ready");
      if (queued) { worker.postMessage(queued); queued = null; }
      return;
    }
    if (msg.type === "fatal") { fail(msg.message); return; }
    if (!pending || msg.runId !== pending.id) return;
    if (msg.type === "packages") pending.onPhase("packages");
    else if (msg.type === "exec-start") {
      pending.onPhase("exec");
      clearTimeout(timer);
      timer = setTimeout(() => stop("timeout"), RUN_TIMEOUT_MS);
    } else if (msg.type === "result") {
      clearTimeout(timer);
      const p = pending; pending = null;
      p.resolve(msg.data);
    }
  }
  function run(payload, onPhase = () => {}) {
    if (failed) start();
    return new Promise((resolve) => {
      const id = ++seq;
      pending = { id, resolve, onPhase };
      const msg = { type: "run", runId: id, payload };
      if (ready) worker.postMessage(msg);
      else { queued = msg; onPhase("waiting"); }
    });
  }
  function stop(reason) {
    clearTimeout(timer);
    const p = pending; pending = null; queued = null;
    if (worker) worker.terminate();
    start();
    if (p) p.resolve({ status: reason || "stopped" });
  }
  return { start, run, stop, onState: (fn) => { onState = fn; } };
})();

Engine.onState((s, message) => {
  const box = $("engine");
  box.dataset.state = s;
  $("engine-text").textContent = s === "ready" ? "פייתון מוכן" : s === "error" ? "פייתון לא נטען" : "טוען את פייתון…";
  box.title = s === "error" && message ? message : "";
});

/* ================================================================
   עורך הקוד (CodeMirror, ואם לא נטען, תיבת טקסט פשוטה)
   ================================================================ */
function createEditor(host, onRun, onChange) {
  if (window.CodeMirror) {
    const cm = window.CodeMirror(host, {
      value: "",
      mode: "python",
      lineNumbers: true,
      indentUnit: 4,
      tabSize: 4,
      indentWithTabs: false,
      direction: "ltr",
      matchBrackets: true,
      viewportMargin: Infinity,
      extraKeys: {
        "Ctrl-Enter": () => onRun(),
        "Cmd-Enter": () => onRun(),
        Tab: (c) => (c.somethingSelected() ? c.indentSelection("add") : c.replaceSelection("    ", "end")),
        "Shift-Tab": (c) => c.indentSelection("subtract"),
      },
    });
    let marked = null;
    const clearError = () => { if (marked) { cm.removeLineClass(marked, "background", "cm-error-line"); marked = null; } };
    cm.on("change", () => { clearError(); onChange(cm.getValue()); });
    return {
      get: () => cm.getValue(),
      set: (v) => { cm.setValue(v); cm.clearHistory(); },
      focus: () => cm.focus(),
      refresh: () => cm.refresh(),
      clearError,
      markError(line) {
        clearError();
        if (line >= 1 && line <= cm.lineCount()) marked = cm.addLineClass(line - 1, "background", "cm-error-line");
      },
    };
  }
  const ta = el("textarea", "editor-fallback");
  ta.dir = "ltr";
  ta.spellcheck = false;
  ta.setAttribute("aria-label", "עורך קוד");
  ta.addEventListener("keydown", (e) => {
    if (e.key === "Tab") {
      e.preventDefault();
      const s = ta.selectionStart;
      ta.setRangeText("    ", s, ta.selectionEnd, "end");
      onChange(ta.value);
    } else if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
      e.preventDefault(); onRun();
    }
  });
  ta.addEventListener("input", () => onChange(ta.value));
  host.append(ta);
  return { get: () => ta.value, set: (v) => { ta.value = v; }, focus: () => ta.focus(), refresh() {}, clearError() {}, markError() {} };
}

let saveTimer = null;
const editor = createEditor($("editor"), () => run(), (value) => {
  const q = QUESTIONS[state.index];
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { state.codes[q.id] = value; persist(); }, 300);
});

/* ================================================================
   ציור תמונה כרשת של פיקסלים עם ערכי RGB
   ================================================================ */
function viewWidth(width, height) {
  const longest = Math.max(width, height);
  const side = Math.min(540, Math.max(300, longest * 135));
  return Math.round((side * width) / longest);
}

function buildInspector(varName, width) {
  const box = el("div", "inspector");
  box.append(el("p", "insp-idle", "רחפו מעל פיקסל, או מעל טאפל ברשימה, כדי לראות את הערכים שלו."));
  return {
    el: box,
    show(i, px, note, isDiff) {
      box.replaceChildren();
      const top = el("div", "insp-top");
      const code = el("code", "insp-code", `${varName}[${i}] = ${tupleText(px)}`);
      code.dir = "ltr";
      top.append(code, el("span", "insp-pos", `שורה ${Math.floor(i / width)}, עמודה ${i % width}`));
      box.append(top);
      if (px) {
        const bars = el("div", "insp-bars");
        bars.dir = "ltr";
        [["R", 0, "#FF1F1F"], ["G", 1, "#12B80A"], ["B", 2, "#1F48FF"]].forEach(([name, k, color]) => {
          const row = el("div", "bar");
          const track = el("span", "bar-track");
          const fill = el("span", "bar-fill");
          fill.style.width = `${(px[k] / 255) * 100}%`;
          fill.style.background = color;
          track.append(fill);
          row.append(el("span", null, name), track, el("span", "bar-val", String(px[k])));
          bars.append(row);
        });
        box.append(bars);
      }
      const notes = [];
      if (note) notes.push(note);
      else if (!px) notes.push("אין פיקסל במקום הזה ברשימה.");
      if (isDiff) notes.push("הפיקסל הזה שונה ממה שציפינו.");
      notes.forEach((t) => { const p = el("p", "insp-note"); p.innerHTML = rich(t); box.append(p); });
    },
  };
}

function buildPixelView({ width, height, pixels, varName, diff = [], notes = {}, animate = false, code = "none", codeHost = null, compact = false }) {
  const n = width * height;
  const view = el("div", "pixel-view");
  if (compact) view.style.maxWidth = `${Math.min(260, viewWidth(width, height))}px`;

  const grid = el("div", "px-grid");
  grid.dir = "ltr";
  grid.setAttribute("role", "img");
  grid.setAttribute("aria-label", `תמונה בגודל ${width} על ${height} פיקסלים`);
  grid.style.gridTemplateColumns = `repeat(${width}, minmax(0, 1fr))`;
  grid.style.aspectRatio = `${width} / ${height}`;

  const diffSet = new Set(diff);
  const inspector = compact ? null : buildInspector(varName, width);
  const cells = [];
  const toks = [];
  let active = -1;
  function activate(i) {
    if (active === i) return;
    if (active >= 0) { cells[active].classList.remove("is-active"); if (toks[active]) toks[active].classList.remove("is-active"); }
    active = i;
    cells[i].classList.add("is-active");
    if (toks[i]) toks[i].classList.add("is-active");
    if (inspector) inspector.show(i, pixels[i] || null, notes[String(i)], diffSet.has(i));
  }

  const step = animate ? Math.min(45, 560 / n) : 0;
  for (let i = 0; i < n; i++) {
    const px = pixels[i] || null;
    const cell = el("div", "px");
    if (px) {
      cell.style.backgroundColor = `rgb(${px[0]}, ${px[1]}, ${px[2]})`;
      cell.style.color = labelColor(px);
    } else {
      cell.classList.add("px-missing");
    }
    if (diffSet.has(i)) cell.classList.add("px-diff");
    if (animate) { cell.classList.add("px-reveal"); cell.style.animationDelay = `${Math.round(i * step)}ms`; }
    cell.append(el("span", "px-idx", String(i)), el("span", "px-tup", tupleText(px)));
    if (!compact) {
      if (n <= 400) cell.tabIndex = 0;
      cell.addEventListener("mouseenter", () => activate(i));
      cell.addEventListener("focus", () => activate(i));
    }
    cells.push(cell);
    grid.append(cell);
  }
  view.append(grid);
  if (inspector) view.append(inspector.el);

  // התאמת גודל הכיתוב לגודל הפיקסל
  let maxLen = 1;
  for (let i = 0; i < n; i++) maxLen = Math.max(maxLen, tupleText(pixels[i] || null).length);
  const fit = () => {
    const cellW = grid.clientWidth / width;
    if (!cellW) return;
    const fs = Math.min(16, (cellW - 16) / (maxLen * 0.62));
    grid.style.setProperty("--fs", `${fs.toFixed(2)}px`);
    grid.style.setProperty("--idx-fs", `${Math.max(10, Math.min(13, cellW * 0.12)).toFixed(1)}px`);
    grid.classList.toggle("hide-tuples", fs < 8);
    grid.classList.toggle("hide-idx", cellW < 28);
  };
  if ("ResizeObserver" in window) new ResizeObserver(fit).observe(grid);
  requestAnimationFrame(fit);

  // הרשימה בפייתון, מקושרת לפיקסלים
  if (code !== "none") {
    const pre = el("pre", "list-code");
    pre.dir = "ltr";
    pre.append(el("span", "tok-name", varName), document.createTextNode(" = [\n"));
    for (let i = 0; i < n; i++) {
      if (i % width === 0) pre.append(document.createTextNode("    "));
      const tok = el("span", "tok-tuple", tupleText(pixels[i] || null));
      tok.addEventListener("mouseenter", () => activate(i));
      toks.push(tok);
      pre.append(tok);
      if (i < n - 1) pre.append(document.createTextNode(i % width === width - 1 ? ",\n" : ", "));
    }
    pre.append(document.createTextNode("\n]"));
    const longestLine = Math.max(...pre.textContent.split("\n").map((l) => l.length));
    const fitCode = () => {
      const avail = pre.clientWidth - 28;
      if (avail <= 0) return;
      pre.style.fontSize = `${Math.max(11, Math.min(13.5, avail / (longestLine * 0.61))).toFixed(2)}px`;
    };
    if ("ResizeObserver" in window) new ResizeObserver(fitCode).observe(pre);
    requestAnimationFrame(fitCode);
    if (code === "details") {
      const d = el("details", "list-details");
      d.append(el("summary", null, "הרשימה בפייתון"), pre);
      view.append(d);
    } else {
      (codeHost || view).append(el("h3", "list-title", "כך התמונה הנתונה שמורה בפייתון"), pre);
    }
  }
  return view;
}

function buildEmptyView(width, height, message) {
  const view = el("div", "pixel-view");
  const box = el("div", "px-empty");
  box.style.aspectRatio = `${width} / ${height}`;
  box.append(el("p", null, message));
  view.append(box);
  return view;
}

function buildCanvas(img) {
  const canvas = document.createElement("canvas");
  canvas.width = img.w;
  canvas.height = img.h;
  const ctx = canvas.getContext("2d");
  const data = ctx.createImageData(img.w, img.h);
  img.pixels.forEach((p, i) => {
    const o = i * 4;
    if (p) { data.data[o] = p[0]; data.data[o + 1] = p[1]; data.data[o + 2] = p[2]; data.data[o + 3] = 255; }
  });
  ctx.putImageData(data, 0, 0);
  return canvas;
}

/* ================================================================
   תצוגת שאלה
   ================================================================ */
function buildNav() {
  const nav = $("qnav");
  nav.replaceChildren();
  QUESTIONS.forEach((q, i) => {
    const b = el("button", "qtab", String(i + 1));
    b.type = "button";
    const solved = !!state.solved[q.id];
    b.setAttribute("aria-label", `שאלה ${i + 1}: ${q.title}${solved ? " (נפתרה)" : ""}`);
    b.title = q.title;
    if (i === state.index) b.setAttribute("aria-current", "step");
    if (solved) b.classList.add("is-solved");
    b.addEventListener("click", () => goTo(i));
    nav.append(b);
  });
}

function updatePager() {
  const q = QUESTIONS[state.index];
  $("prev-btn").disabled = state.index === 0;
  const next = $("next-btn");
  next.disabled = state.index === QUESTIONS.length - 1;
  next.classList.toggle("btn-primary", !!state.solved[q.id] && !next.disabled);
}

function resetResult() {
  const q = QUESTIONS[state.index];
  $("result-view").replaceChildren(buildEmptyView(q.width, q.height, "הריצו את הקוד כדי לראות כאן את התמונה החדשה."));
  $("result-meta").textContent = "";
  renderOutput(null);
}

let splitObserver = null;
function updateSplit() {
  const q = QUESTIONS[state.index];
  const box = $("stage-inner");
  const cs = getComputedStyle(box);
  const content = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  box.classList.toggle("is-split", content >= 2 * viewWidth(q.width, q.height) + 28);
}

function renderQuestion() {
  const q = QUESTIONS[state.index];
  $("q-count").textContent = `שאלה ${state.index + 1} מתוך ${QUESTIONS.length}`;
  $("q-title").textContent = q.title;
  $("q-goal").innerHTML = q.goal;
  const reqs = $("q-reqs");
  reqs.replaceChildren();
  (q.requirements || []).forEach((r) => { const li = el("li"); li.innerHTML = r; reqs.append(li); });
  reqs.hidden = !(q.requirements && q.requirements.length);
  const hint = $("q-hint");
  hint.open = false;
  hint.hidden = !q.hint;
  $("q-hint-body").innerHTML = q.hint || "";

  $("stage-inner").style.setProperty("--col", `${viewWidth(q.width, q.height)}px`);
  updateSplit();
  if (!splitObserver && "ResizeObserver" in window) {
    splitObserver = new ResizeObserver(updateSplit);
    splitObserver.observe($("stage-inner"));
  }
  $("given-meta").textContent = `${q.width}×${q.height} פיקסלים`;
  $("given-code").replaceChildren();
  $("given-view").replaceChildren(buildPixelView({
    width: q.width, height: q.height, pixels: q.pixels, varName: "pixels", code: "open", codeHost: $("given-code"),
  }));
  resetResult();

  editor.set(typeof state.codes[q.id] === "string" ? state.codes[q.id] : q.starter);
  editor.clearError();
  setStatus(null);
  buildNav();
  updatePager();
  document.title = `שאלה ${state.index + 1}: ${q.title} | פיקסל אחר פיקסל`;
  try { history.replaceState(null, "", `#q${state.index + 1}`); } catch (e) { /* file:// */ }
  requestAnimationFrame(() => editor.refresh());
}

function goTo(i) {
  if (i < 0 || i >= QUESTIONS.length || i === state.index) return;
  if (state.running) {
    state.runToken++;
    state.running = false;
    setRunButton(false);
    Engine.stop(null);
  }
  clearTimeout(saveTimer);
  state.codes[QUESTIONS[state.index].id] = editor.get();
  state.index = i;
  persist();
  renderQuestion();
  document.querySelector(".stage").scrollTop = 0;
  document.querySelector(".task").scrollTop = 0;
}

/* ================================================================
   הרצה ומשוב
   ================================================================ */
function setRunButton(running) {
  const btn = $("run-btn");
  btn.classList.toggle("is-running", running);
  $("run-label").textContent = running ? "עצירה" : "הרצה";
  $("run-ico").innerHTML = running ? '<rect x="2" y="2" width="10" height="10"/>' : '<path d="M2 1 L13 7 L2 13 Z"/>';
}

function setStatus(kind, verdict, parts = [], action = null) {
  const box = $("status");
  box.replaceChildren();
  if (!kind) return;
  const wrap = el("div", "status-box");
  wrap.dataset.kind = kind;
  wrap.append(el("div", "verdict", verdict));
  const body = el("div", "status-body");
  parts.forEach((part) => {
    if (part instanceof Node) body.append(part);
    else { const p = el("p"); p.innerHTML = part; body.append(p); }
  });
  if (action) body.append(action);
  wrap.append(body);
  box.append(wrap);
}

function renderOutput(data) {
  const text = data && data.stdout ? data.stdout : "";
  const images = (data && data.images) || [];
  const pre = $("stdout");
  pre.textContent = text;
  pre.hidden = !text;
  $("stdout-empty").hidden = !!text || images.length > 0;
  const shown = $("shown-images");
  shown.replaceChildren();
  images.forEach((img, k) => {
    const fig = el("figure");
    if (img.w * img.h <= 256) {
      fig.append(buildPixelView({ width: img.w, height: img.h, pixels: img.pixels, varName: "", compact: true }));
    } else {
      fig.append(buildCanvas(img));
    }
    fig.append(el("figcaption", null, `${img.label} ${k + 1}: ${img.w}×${img.h}`));
    shown.append(fig);
  });
}

function emptyMessage(status) {
  switch (status) {
    case "syntax":
    case "error": return "הקוד נעצר בגלל שגיאה, ולכן עדיין אין תמונה חדשה.";
    case "timeout":
    case "stopped": return "ההרצה נעצרה לפני שנוצרה תמונה.";
    case "missing": return "לא נמצאה רשימה של פיקסלים להצגה.";
    case "invalid": return "המשתנה שנוצר אינו רשימה של פיקסלים.";
    default: return "הריצו את הקוד כדי לראות כאן את התמונה החדשה.";
  }
}

function nextButton() {
  if (state.index >= QUESTIONS.length - 1) return null;
  const b = el("button", "btn btn-primary", "לשאלה הבאה");
  b.type = "button";
  b.addEventListener("click", () => goTo(state.index + 1));
  return b;
}

function showResult(q, data) {
  const n = q.width * q.height;
  editor.clearError();
  renderOutput(data);

  if (data.render) {
    $("result-view").replaceChildren(buildPixelView({
      width: q.width, height: q.height, pixels: data.render, varName: data.var,
      diff: data.diff || [], notes: data.cellNotes || {}, animate: !reduceMotion, code: "details",
    }));
    $("result-meta").innerHTML = `המשתנה <code>${escapeHtml(data.var)}</code>`;
  } else {
    $("result-view").replaceChildren(buildEmptyView(q.width, q.height, emptyMessage(data.status)));
    $("result-meta").textContent = "";
  }

  const problems = (data.problems || []).map(rich);
  const violations = (data.violations || []).map(rich);
  const err = data.error;

  switch (data.status) {
    case "correct": {
      state.solved[q.id] = true;
      persist();
      buildNav();
      updatePager();
      const last = state.index === QUESTIONS.length - 1;
      setStatus("ok", "נכון", [
        "כל הכבוד. התמונה שיצרתם זהה לתמונה המבוקשת.",
        ...(last ? ["סיימתם את כל השאלות."] : []),
      ], nextButton());
      break;
    }
    case "wrong": {
      const parts = [...problems];
      const diffCount = (data.diff || []).length;
      if (data.unchanged) parts.push("התמונה לא השתנתה. בדקו שאתם משנים את הפיקסלים הנכונים.");
      else if (diffCount) parts.push(`${diffCount} מתוך ${n} פיקסלים שונים ממה שציפינו. הם מסומנים ב-✕ בתמונה שלכם.`);
      parts.push(...violations);
      setStatus("bad", "עדיין לא", parts);
      break;
    }
    case "almost":
      setStatus("warn", "כמעט", [rich("הצבעים נכונים, אבל כל פיקסל צריך להיות טאפל בסוגריים עגולים, למשל `(r, g, 0)`, ולא רשימה בסוגריים מרובעים.")]);
      break;
    case "rule":
      setStatus("warn", "כמעט", ["התמונה נכונה, אבל הדרך לא מתאימה לשאלה.", ...violations]);
      break;
    case "invalid":
      setStatus("bad", "לא תקין", problems);
      break;
    case "missing":
      setStatus("bad", "חסר", [rich(`לא נמצא משתנה בשם \`${q.resultVars[0]}\`. צרו אותו בקוד שלכם.`)]);
      break;
    case "syntax":
    case "error": {
      const parts = [];
      parts.push(err && err.line ? `שגיאה בשורה ${err.line}.` : "שגיאה בזמן ההרצה.");
      if (err) {
        parts.push(el("code", "err-code", `${err.type}: ${err.message}`));
        if (err.hint) parts.push(rich(err.hint));
        if (err.line) editor.markError(err.line);
      }
      setStatus("bad", "שגיאה", parts);
      break;
    }
    case "timeout":
      setStatus("bad", "נעצר", [`הקוד רץ יותר מ-${RUN_TIMEOUT_MS / 1000} שניות ולכן נעצר. ייתכן שיש לולאה שלא מסתיימת.`]);
      break;
    case "stopped":
      setStatus("info", "נעצר", ["ההרצה נעצרה."]);
      break;
    case "engine":
      setStatus("bad", "תקלה", ["פייתון לא נטען. בדקו את החיבור לאינטרנט ורעננו את הדף.", el("code", "err-code", data.message || "")]);
      break;
    case "ran":
      setStatus("info", "רץ", ["הקוד רץ עד הסוף.", ...problems, ...violations]);
      break;
    default:
      setStatus("bad", "תקלה", ["משהו השתבש בהרצה.", el("code", "err-code", data.message || "")]);
  }

  if (data.solutionError) console.warn(`הפתרון של שאלה ${q.id} נכשל:`, data.solutionError);

  if (wideLayout.matches) {
    $("result-block").scrollIntoView({ block: "nearest", behavior: reduceMotion ? "auto" : "smooth" });
  }
}

async function run() {
  if (state.running) { Engine.stop("stopped"); return; }
  const q = QUESTIONS[state.index];
  const token = ++state.runToken;
  state.running = true;
  setRunButton(true);
  setStatus("busy", "רץ", ["מריץ את הקוד…"]);
  clearTimeout(saveTimer);
  state.codes[q.id] = editor.get();
  persist();

  const data = await Engine.run({
    code: editor.get(),
    solution: q.solution || "",
    pixels: q.pixels,
    width: q.width,
    height: q.height,
    resultVars: q.resultVars,
    rules: q.rules || {},
  }, (phase) => {
    if (token !== state.runToken) return;
    if (phase === "waiting") setStatus("busy", "ממתין", ["פייתון עדיין נטען. הקוד ירוץ מיד כשהטעינה תסתיים."]);
    else if (phase === "packages") setStatus("busy", "טוען", ["טוען ספריות שהקוד צריך…"]);
    else if (phase === "exec") setStatus("busy", "רץ", ["מריץ את הקוד…"]);
  });

  if (token !== state.runToken) return;
  state.running = false;
  setRunButton(false);
  showResult(q, data);
}

/* ================================================================
   כפתורים
   ================================================================ */
$("run-btn").addEventListener("click", () => run());
$("prev-btn").addEventListener("click", () => goTo(state.index - 1));
$("next-btn").addEventListener("click", () => goTo(state.index + 1));

let resetArmed = null;
function disarmReset() {
  clearTimeout(resetArmed);
  resetArmed = null;
  const btn = $("reset-btn");
  btn.textContent = "איפוס הקוד";
  btn.classList.remove("is-armed");
}
$("reset-btn").addEventListener("click", () => {
  const btn = $("reset-btn");
  if (!resetArmed) {
    btn.textContent = "לחצו שוב לאיפוס";
    btn.classList.add("is-armed");
    resetArmed = setTimeout(disarmReset, 3000);
    return;
  }
  disarmReset();
  const q = QUESTIONS[state.index];
  editor.set(q.starter);
  state.codes[q.id] = q.starter;
  persist();
  resetResult();
  setStatus(null);
  editor.focus();
});

document.addEventListener("keydown", (e) => {
  if (e.defaultPrevented) return;
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); }
});
window.addEventListener("hashchange", () => {
  const m = /^#q(\d+)$/.exec(location.hash);
  if (m) goTo(Number(m[1]) - 1);
});

/* ================================================================
   התחלה
   ================================================================ */
renderQuestion();
Engine.start();
})();
</script>
</body>
</html>
